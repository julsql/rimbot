name: E2E (Cypress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: cypress against full docker-compose stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Write minimal test .env
        # Les tests montent une stack jetable : le backend ne lit que DATABASE_URL,
        # la db Postgres que POSTGRES_*. Aucun secret de prod n'est necessaire.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=rimbot
          POSTGRES_PASSWORD=rimbot
          POSTGRES_DB=rimbot
          DATABASE_URL=postgresql://rimbot:rimbot@db:5432/rimbot
          EOF

      - name: Build & start the stack
        run: |
          docker compose up --build -d
          # Attente du health du backend via le proxy nginx (la DB seed est lente).
          echo "Check db"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8004/api/health >/dev/null 2>&1; then
              echo "stack OK"; break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8004/api/health
          curl -fsS http://localhost:8004/ | head -5

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Cypress + deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          working-directory: frontend
          install: false
          browser: chrome
          config: baseUrl=http://localhost:8004

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v
