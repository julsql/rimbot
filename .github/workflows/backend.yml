name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     poeme
          POSTGRES_PASSWORD: poeme
          POSTGRES_DB:       poeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poeme -d poeme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Load schema and seed into Postgres
        env:
          PGPASSWORD: poeme
        run: |
          # On déplace les CSV de seed dans /tmp/seed pour que les chemins
          # absolus présents dans 02_seed.sql restent valides.
          sudo mkdir -p /seed
          sudo cp -r ../db/init/seed/* /seed/
          psql -h localhost -U poeme -d poeme -f ../db/init/01_schema.sql
          psql -h localhost -U poeme -d poeme -f ../db/init/02_seed.sql

      - name: Run unit tests (no DB)
        env:
          DATABASE_URL: ""
        run: pytest -m "not integration" --cov=app --cov-report=term-missing

      - name: Run integration tests (real Postgres)
        env:
          DATABASE_URL: postgresql://poeme:poeme@localhost:5432/poeme
        run: pytest -m integration --cov=app --cov-append --cov-report=term-missing

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: poeme-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
