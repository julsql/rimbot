name: Release (build & push)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: db
            context: ./db
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=$(echo ${GITHUB_REF_NAME} | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "lower=$(echo ${{ github.repository_owner }} | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.lower }}/rimbot-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.lower }}/rimbot-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
